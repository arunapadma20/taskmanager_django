{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="{% url 'task_list' %}">&#10003; TaskFlow</a>
    <div>
      {% if user.is_authenticated %}
        <span class="muted">Hi, {{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}" class="inline">{% csrf_token %}<button class="btn ghost">Logout</button></form>
      {% else %}
        <a class="btn ghost" href="{% url 'login' %}">Login</a>
        <a class="btn" href="{% url 'register' %}">Sign up</a>
      {% endif %}
    </div>
  </nav>
  <main class="container">
    {% for m in messages %}<div class="alert {{ m.tags }}">{{ m }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
