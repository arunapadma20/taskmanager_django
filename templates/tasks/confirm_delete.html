{% extends 'base.html' %}
{% block content %}
<div class="panel">
  <h2>Delete task?</h2>
  <p>"{{ task.title }}" will be permanently removed.</p>
  <form method="post">{% csrf_token %}
    <div class="row"><button class="btn danger">Yes, delete</button><a class="btn ghost" href="{% url 'task_list' %}">Cancel</a></div>
  </form>
</div>
{% endblock %}
