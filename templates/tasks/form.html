{% extends 'base.html' %}
{% block content %}
<div class="panel">
  <h2>{{ heading }}</h2>
  <form method="post">{% csrf_token %}
    {% for f in form %}
      <label>{{ f.label }}</label>{{ f }}
      {% for e in f.errors %}<small class="err">{{ e }}</small>{% endfor %}
    {% endfor %}
    <div class="row"><button class="btn">Save</button><a class="btn ghost" href="{% url 'task_list' %}">Cancel</a></div>
  </form>
</div>
{% endblock %}
