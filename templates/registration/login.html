{% extends 'base.html' %}
{% block content %}
<div class="panel narrow">
  <h2>Login</h2>
  <form method="post">{% csrf_token %}
    {% for f in form %}<label>{{ f.label }}</label>{{ f }}{% endfor %}
    {% if form.errors %}<small class="err">Invalid username or password.</small>{% endif %}
    <div class="row"><button class="btn">Login</button></div>
  </form>
  <p class="muted">No account? <a href="{% url 'register' %}">Sign up</a></p>
</div>
{% endblock %}
